<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title id="tab-title">Our Love in Numbers ⏳💖</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@600;700;800;900&family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,600;1,700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --color-pink-bg: #fff0f3;
      --color-white: #ffffff;
      --color-black: #3a2228;
      --color-heart: #ff2a5f;
      --rose-pink: #ff758c;
      --rose-accent: #ff416c;
      --gold-light: #ffd700;
      --font-body: 'Poppins', sans-serif;
      --font-cinzel: 'Cinzel', serif;
      --font-calligraphy: 'Alex Brush', cursive;
      --font-cute: 'Dancing Script', cursive;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background-color: var(--color-pink-bg);
      background-image: 
        radial-gradient(circle at 50% 12%, rgba(255, 182, 193, 0.5) 0%, transparent 60%),
        radial-gradient(#ffccd5 1.5px, transparent 1.5px),
        radial-gradient(rgba(255, 107, 139, 0.15) 1.5px, transparent 0);
      background-size: 100% 100%, 28px 28px, 28px 28px;
      background-position: 0 0, 0 0, 14px 14px;
      font-family: var(--font-body);
      overflow-x: hidden;
      position: relative;
      padding: 65px 14px 20px;
      color: var(--color-black);
    }

    /* THEMED HANGING FAIRY BULB LIGHTS */
    .ceiling-lights {
      position: fixed;
      top: 0; left: 0; width: 100%;
      height: 110px;
      pointer-events: none;
      z-index: 25;
      display: flex;
      justify-content: space-around;
      padding: 0 10px;
    }
    .light-hanger {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: top center;
      animation: gentleSway 4s ease-in-out infinite alternate;
    }
    .wire {
      width: 1.5px;
      background: linear-gradient(to bottom, rgba(255, 107, 139, 0.5), rgba(255, 215, 0, 0.8));
    }
    .holder {
      width: 7px;
      height: 6px;
      background: #c78292;
      border-radius: 2px 2px 0 0;
    }
    .bulb {
      width: 15px;
      height: 22px;
      background: radial-gradient(circle at 50% 35%, #ffffff 0%, #fff0a8 45%, #ff9ebb 100%);
      border-radius: 50% 50% 45% 45% / 40% 40% 60% 60%;
      box-shadow: 0 0 16px 6px rgba(255, 158, 187, 0.8), 0 0 25px rgba(255, 215, 0, 0.4);
    }
    @keyframes gentleSway {
      0% { transform: rotate(-3.5deg); }
      100% { transform: rotate(3.5deg); }
    }

    /* AMBIENT FIREFLIES & GLOW SPARKLES (NO RAIN) */
    .sparkle-container {
      position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden;
    }
    .firefly {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #ffd700 60%, rgba(255, 117, 140, 0.4) 100%);
      box-shadow: 0 0 8px 2px rgba(255, 215, 0, 0.65), 0 0 16px 4px rgba(255, 107, 139, 0.35);
      animation: drift var(--dur) ease-in-out infinite alternate, twinkle var(--twinkle-dur) ease-in-out infinite;
    }
    .fairy-symbol {
      position: absolute; font-size: 14px; color: #ff758c;
      filter: drop-shadow(0 0 6px rgba(255, 117, 140, 0.5));
      animation: softFloat var(--dur) ease-in-out infinite alternate, twinkle var(--twinkle-dur) ease-in-out infinite;
    }
    @keyframes drift {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(-22px) translateX(8px); }
    }
    @keyframes softFloat {
      0% { transform: translateY(0px) scale(0.9); }
      100% { transform: translateY(-16px) scale(1.15); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.95; }
    }

    /* SCREEN TAP HEART POP */
    .tap-heart-particle {
      position: fixed; pointer-events: none; z-index: 9999;
      font-size: 20px; animation: heartFly 1s ease-out forwards;
    }
    @keyframes heartFly {
      0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
      100% { transform: translate(-50%, -120px) scale(1.4); opacity: 0; }
    }

    /* HEADER */
    .header-group {
      text-align: center;
      z-index: 10;
      margin-top: 4px;
    }
    .mini-sub {
      font-family: var(--font-cinzel);
      font-size: 0.8rem;
      letter-spacing: 2.5px;
      color: var(--color-heart);
      text-transform: uppercase;
      font-weight: 800;
    }
    .main-title {
      font-family: var(--font-calligraphy);
      font-size: clamp(38px, 9.5vw, 46px);
      line-height: 1.1;
      margin-top: 2px;
      background: linear-gradient(135deg, #ff1493 0%, #ff416c 50%, #ff758c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 6px rgba(255, 20, 147, 0.25));
    }

    /* MAIN CONTAINER CARD */
    .main-card {
      width: 100%;
      max-width: 375px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      border: 3.5px solid var(--color-black);
      border-radius: 34px;
      padding: 22px 16px 20px;
      box-shadow: 0 18px 45px rgba(255, 107, 139, 0.28), 0 0 25px rgba(255, 214, 223, 0.5);
      z-index: 10;
      text-align: center;
      margin: auto 0;
    }

    .counter-title {
      font-family: var(--font-cute);
      font-size: 1.45rem;
      color: var(--color-heart);
      margin-bottom: 14px;
      font-weight: 700;
    }

    /* LIVE LOVE COUNTER GRID */
    .time-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .time-box {
      background: #fff0f3;
      border: 2px solid var(--rose-pink);
      border-radius: 18px;
      padding: 10px 4px;
      box-shadow: 0 4px 14px rgba(255, 107, 139, 0.15);
    }
    .time-num {
      font-family: var(--font-cinzel);
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--color-black);
      line-height: 1.1;
    }
    .time-label {
      font-size: 0.72rem;
      letter-spacing: 1px;
      color: var(--color-heart);
      text-transform: uppercase;
      font-weight: 800;
      margin-top: 4px;
    }

    /* MINI QUIZ SECTION */
    .quiz-section {
      background: #fffbfd;
      border: 2px dashed var(--rose-pink);
      border-radius: 22px;
      padding: 16px 12px;
      margin-top: 8px;
    }

    .quiz-q {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--color-black);
      margin-bottom: 12px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .opt-btn {
      background: #ffffff;
      border: 2px solid var(--rose-pink);
      border-radius: 25px;
      padding: 9px 16px;
      font-family: var(--font-body);
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--color-black);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(255, 107, 139, 0.1);
    }
    .opt-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 107, 139, 0.25);
    }
    .opt-btn.correct {
      background: linear-gradient(135deg, #ff758c, #ff416c) !important;
      color: #ffffff !important;
      border-color: var(--color-black) !important;
      box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
    }

    .quiz-feedback {
      font-family: var(--font-cute);
      font-size: 1.3rem;
      color: var(--color-heart);
      min-height: 28px;
      margin-top: 10px;
      font-weight: 700;
    }

    /* BOTTOM BUTTON */
    .bottom-btn-row {
      margin-top: 14px;
      width: 100%;
      display: flex;
      justify-content: center;
      z-index: 10;
    }
    .btn-action {
      padding: 11px 32px;
      border-radius: 50px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      border: 2.5px solid var(--color-black);
      background: linear-gradient(135deg, #ff758c, #ff416c);
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 65, 108, 0.35);
      transition: all 0.25s ease;
    }
    .btn-action:hover {
      transform: scale(1.04);
      box-shadow: 0 10px 25px rgba(255, 65, 108, 0.5);
    }
  </style>
</head>
<body>

  <!-- Fairy Lights -->
  <div class="ceiling-lights">
    <div class="light-hanger"><div class="wire" style="height: 38px;"></div><div class="holder"></div><div class="bulb"></div></div>
    <div class="light-hanger"><div class="wire" style="height: 52px;"></div><div class="holder"></div><div class="bulb"></div></div>
    <div class="light-hanger"><div class="wire" style="height: 34px;"></div><div class="holder"></div><div class="bulb"></div></div>
    <div class="light-hanger"><div class="wire" style="height: 48px;"></div><div class="holder"></div><div class="bulb"></div></div>
    <div class="light-hanger"><div class="wire" style="height: 38px;"></div><div class="holder"></div><div class="bulb"></div></div>
  </div>

  <!-- Ambient Glowing Fireflies & Sparkles (No Rain) -->
  <div class="sparkle-container" id="sparkleBox"></div>

  <div class="header-group">
    <div class="mini-sub">Together Forever</div>
    <h1 class="main-title">Our Love in Numbers</h1>
  </div>

  <div class="main-card">
    <div class="counter-title">Counting every single moment of love...</div>

    <!-- Live Ticking Clock Grid -->
    <div class="time-grid">
      <div class="time-box">
        <div class="time-num" id="daysBox">00</div>
        <div class="time-label">Days</div>
      </div>
      <div class="time-box">
        <div class="time-num" id="hoursBox">00</div>
        <div class="time-label">Hours</div>
      </div>
      <div class="time-box">
        <div class="time-num" id="minsBox">00</div>
        <div class="time-label">Mins</div>
      </div>
      <div class="time-box">
        <div class="time-num" id="secsBox">00</div>
        <div class="time-label">Secs</div>
      </div>
    </div>

    <!-- Mini Trivia Quiz -->
    <div class="quiz-section">
      <div class="quiz-q" id="questionText">Who loves more in this relationship? 💕</div>
      <div class="options-grid" id="optionsContainer"></div>
      <div class="quiz-feedback" id="quizFeedback"></div>
    </div>

    <!-- Link to blow.html -->
    <div class="bottom-btn-row">
      <a href="blow.html" class="btn-action">
        <span>Make A Wish &amp; Cake</span>
        <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>
  </div>

  <script src="anniversary-config.js"></script>
  <script>
    // 1. Soft Ambient Floating Sparkles & Fireflies
    const box = document.getElementById('sparkleBox');
    const symbols = ['✨', '🌸', '💖', '🌟'];

    for (let i = 0; i < 16; i++) {
      const dot = document.createElement('div');
      dot.className = 'firefly';
      const size = Math.random() * 5 + 4;
      dot.style.width = `${size}px`;
      dot.style.height = `${size}px`;
      dot.style.left = `${Math.random() * 92 + 4}%`;
      dot.style.top = `${Math.random() * 88 + 6}%`;
      dot.style.setProperty('--dur', `${3 + Math.random() * 3}s`);
      dot.style.setProperty('--twinkle-dur', `${2 + Math.random() * 2.5}s`);
      dot.style.animationDelay = `${Math.random() * 3}s`;
      box.appendChild(dot);
    }

    for (let i = 0; i < 10; i++) {
      const sym = document.createElement('div');
      sym.className = 'fairy-symbol';
      sym.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      sym.style.left = `${Math.random() * 90 + 5}%`;
      sym.style.top = `${Math.random() * 85 + 8}%`;
      sym.style.setProperty('--dur', `${3.5 + Math.random() * 3}s`);
      sym.style.setProperty('--twinkle-dur', `${2 + Math.random() * 2}s`);
      sym.style.animationDelay = `${Math.random() * 2.5}s`;
      box.appendChild(sym);
    }

    // 2. Romantic Screen Tap Heart Popping Effect
    window.addEventListener('pointerdown', (e) => {
      const heart = document.createElement('div');
      heart.className = 'tap-heart-particle';
      const heartIcons = ['💖', '💕', '✨', '💍', '🌸'];
      heart.textContent = heartIcons[Math.floor(Math.random() * heartIcons.length)];
      heart.style.left = e.clientX + 'px';
      heart.style.top = e.clientY + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1000);
    });

    // 3. Live Love Counter Logic
    const weddingDate = (typeof ANNIVERSARY_CONFIG !== "undefined" && ANNIVERSARY_CONFIG.startDate)
      ? new Date(ANNIVERSARY_CONFIG.startDate)
      : new Date("2026-04-30T00:00:00");

    function updateCounter() {
      const now = new Date();
      const diff = Math.abs(now - weddingDate);

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById('daysBox').textContent = String(days).padStart(2, '0');
      document.getElementById('hoursBox').textContent = String(hours).padStart(2, '0');
      document.getElementById('minsBox').textContent = String(minutes).padStart(2, '0');
      document.getElementById('secsBox').textContent = String(seconds).padStart(2, '0');
    }
    setInterval(updateCounter, 1000);
    updateCounter();

    // 4. Config Driven Quiz Setup
    if (typeof ANNIVERSARY_CONFIG !== "undefined") {
      if (ANNIVERSARY_CONFIG.quizQuestion) {
        document.getElementById('questionText').textContent = ANNIVERSARY_CONFIG.quizQuestion;
      }
      const optBox = document.getElementById('optionsContainer');
      const opts = ANNIVERSARY_CONFIG.quizOptions || ["Both Equally ♾️", "Kuldeep ❤️", "Usha Kumari 💖"];
      opts.forEach((optText, idx) => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.innerHTML = `<span>${optText}</span> <i class="fa-regular fa-heart"></i>`;
        b.onclick = () => answerQuiz(idx);
        optBox.appendChild(b);
      });
    }

    function answerQuiz(optionIdx) {
      const btns = document.querySelectorAll('.opt-btn');
      btns.forEach((b, i) => {
        if(i === optionIdx) b.classList.add('correct');
        b.style.pointerEvents = 'none';
      });

      const feedback = document.getElementById('quizFeedback');
      feedback.textContent = (typeof ANNIVERSARY_CONFIG !== "undefined" && ANNIVERSARY_CONFIG.quizFeedback)
        ? ANNIVERSARY_CONFIG.quizFeedback
        : "Correct! Infinite love forever ♾️✨";

      confetti({
        particleCount: 85,
        spread: 80,
        origin: { y: 0.7 },
        colors: ['#ff1493', '#ff416c', '#ff758c', '#ffd700', '#ffffff']
      });
    }
  </script>
</body>
</html>
