<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title id="tab-title">Our 7 Sacred Vows 💍💖</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@600;700;800&family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,600;1,700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --color-pink-bg: #fff0f3;
      --color-white: #ffffff;
      --color-black: #3a2228;
      --color-heart: #ff2a5f;
      --rose-pink: #ff758c;
      --rose-accent: #ff416c;
      --gold-light: #ffd700;
      --font-body: 'Poppins', sans-serif;
      --font-cinzel: 'Cinzel', serif;
      --font-calligraphy: 'Alex Brush', cursive;
      --font-cute: 'Dancing Script', cursive;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background-color: var(--color-pink-bg);
      background-image: 
        radial-gradient(circle at 50% 12%, rgba(255, 182, 193, 0.5) 0%, transparent 60%),
        radial-gradient(#ffccd5 1.5px, transparent 1.5px),
        radial-gradient(rgba(255, 107, 139, 0.15) 1.5px, transparent 0);
      background-size: 100% 100%, 28px 28px, 28px 28px;
      background-position: 0 0, 0 0, 14px 14px;
      font-family: var(--font-body);
      overflow-x: hidden;
      position: relative;
      padding: 65px 14px 20px;
      color: var(--color-black);
    }

    /* THEMED HANGING FAIRY BULB LIGHTS */
    .ceiling-lights {
      position: fixed;
      top: 0; left: 0; width: 100%;
      height: 110px;
      pointer-events: none;
      z-index: 25;
      display: flex;
      justify-content: space-around;
      padding: 0 10px;
    }
    .light-hanger {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: top center;
      animation: gentleSway 4s ease-in-out infinite alternate;
    }
    .wire {
      width: 1.5px;
      background: linear-gradient(to bottom, rgba(255, 107, 139, 0.5), rgba(255, 215, 0, 0.8));
    }
    .holder {
      width: 7px;
      height: 6px;
      background: #c78292;
      border-radius: 2px 2px 0 0;
    }
    .bulb {
      width: 15px;
      height: 22px;
      background: radial-gradient(circle at 50% 35%, #ffffff 0%, #fff0a8 45%, #ff9ebb 100%);
      border-radius: 50% 50% 45% 45% / 40% 40% 60% 60%;
      box-shadow: 0 0 16px 6px rgba(255, 158, 187, 0.8), 0 0 25px rgba(255, 215, 0, 0.4);
    }
    @keyframes gentleSway {
      0% { transform: rotate(-3.5deg); }
      100% { transform: rotate(3.5deg); }
    }

    /* AMBIENT FIREFLIES & GLOW SPARKLES (NO RAIN) */
    .sparkle-container {
      position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden;
    }
    .firefly {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #ffd700 60%, rgba(255, 117, 140, 0.4) 100%);
      box-shadow: 0 0 8px 2px rgba(255, 215, 0, 0.65), 0 0 16px 4px rgba(255, 107, 139, 0.35);
      animation: drift var(--dur) ease-in-out infinite alternate, twinkle var(--twinkle-dur) ease-in-out infinite;
    }
    .fairy-symbol {
      position: absolute; font-size: 14px; color: #ff758c;
      filter: drop-shadow(0 0 6px rgba(255, 117, 140, 0.5));
      animation: softFloat var(--dur) ease-in-out infinite alternate, twinkle var(--twinkle-dur) ease-in-out infinite;
    }
    @keyframes drift {
      0% { transform: translateY(0px) translateX(0px); }
      100% { transform: translateY(-22px) translateX(8px); }
    }
    @keyframes softFloat {
      0% { transform: translateY(0px) scale(0.9); }
      100% { transform: translateY(-16px) scale(1.15); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.95; }
    }

    /* SCREEN TAP HEART POP */
    .tap-heart-particle {
      position: fixed; pointer-events: none; z-index: 9999;
      font-size: 20px; animation: heartFly 1s ease-out forwards;
    }
    @keyframes heartFly {
      0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
      100% { transform: translate(-50%, -120px) scale(1.4); opacity: 0; }
    }

    /* HEADER */
    .header-group {
      text-align: center;
      z-index: 10;
      margin-top: 4px;
    }
    .vow-subtitle {
      font-family: var(--font-cinzel);
      font-size: 0.8rem;
      letter-spacing: 2.5px;
      color: var(--color-heart);
      text-transform: uppercase;
      font-weight: 800;
    }
    .vow-main-title {
      font-family: var(--font-calligraphy);
      font-size: clamp(38px, 9.5vw, 46px);
      line-height: 1.1;
      margin-top: 2px;
      background: linear-gradient(135deg, #ff1493 0%, #ff416c 50%, #ff758c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 6px rgba(255, 20, 147, 0.25));
    }

    /* VOW CARDS STACK */
    .vow-card-wrapper {
      position: relative;
      width: 100%;
      max-width: 350px;
      height: 64vh;
      max-height: 480px;
      min-height: 410px;
      margin: auto 0;
      perspective: 1200px;
      z-index: 10;
    }

    .vow-card {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 32px;
      border: 3.5px solid var(--color-black);
      box-shadow: 0 18px 45px rgba(255, 107, 139, 0.28), 0 0 25px rgba(255, 214, 223, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 16px 14px;
      backdrop-filter: blur(16px);
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      opacity: 0;
      pointer-events: none;
      transform: scale(0.92) translateY(20px);
    }
    .vow-card.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1) translateY(0);
      z-index: 5;
    }

    .vow-number-pill {
      font-family: var(--font-cinzel);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      background: linear-gradient(135deg, #ff758c, #ff416c);
      border: 2px solid var(--color-black);
      padding: 5px 18px;
      border-radius: 25px;
      text-transform: uppercase;
      box-shadow: 0 4px 12px rgba(255, 65, 108, 0.25);
    }

    .vow-photo-box {
      width: 100%;
      flex: 1;
      border-radius: 20px;
      overflow: hidden;
      border: 2.5px solid var(--color-black);
      margin: 10px 0;
      background: #fff0f3;
      box-shadow: 0 8px 20px rgba(255, 107, 139, 0.2);
    }
    .vow-photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .vow-text-card {
      width: 100%;
      min-height: 68px;
      background: #fffbfd;
      border: 2px solid var(--rose-pink);
      border-radius: 20px;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 4px 14px rgba(255, 107, 139, 0.15);
    }
    .vow-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--color-heart);
      margin-bottom: 2px;
    }
    .vow-desc {
      font-family: var(--font-cute);
      font-size: 1.25rem;
      color: #4a1525;
      font-weight: 700;
      line-height: 1.25;
    }

    /* CONTROLS */
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      z-index: 10;
      margin-top: 10px;
    }
    .btn-circle {
      background: #ffffff;
      color: var(--color-heart);
      border: 2.5px solid var(--color-black);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(255, 107, 139, 0.25);
      transition: all 0.25s ease;
    }
    .btn-circle:hover {
      transform: scale(1.06);
    }
    .counter-pill {
      font-family: var(--font-cinzel);
      font-size: 13px;
      font-weight: 800;
      color: var(--color-black);
      background: #ffffff;
      padding: 8px 20px;
      border-radius: 25px;
      border: 2.5px solid var(--color-black);
      box-shadow: 0 4px 14px rgba(255, 107, 139, 0.2);
    }

    .bottom-btn-row {
      margin-top: 14px;
      width: 100%;
      display: flex;
      justify-content: center;
      z-index: 10;
    }
    .btn-action {
      padding: 11px 32px;
      border-radius: 50px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      border: 2.5px solid var(--color-black);
      background: linear-gradient(135deg, #ff758c, #ff416c);
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(255, 65, 108, 0.35);
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .btn-action:hover {
      transform: scale(1.04);
      box-shadow: 0 10px 25px rgba(255, 65, 108, 0.5);
    }
    .btn-locked {
      opacity: 0.45;
      filter: grayscale(0.7);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Fairy Lights -->
  <div class="ceiling-lights">
    <div class="light-hanger"><div class="wire" style="height: 38px;"></div><div class="holder"></div><div class="bulb"></div></div>
    <div class="light-hanger"><div class="wire" style="height: 52px;"></div><div class="holder"></div><div class="bulb"></div></div>
    <div class="light-hanger"><div class="wire" style="height: 34px;"></div><div class="holder"></div><div class="bulb"></div></div>
    <div class="light-hanger"><div class="wire" style="height: 48px;"></div><div class="holder"></div><div class="bulb"></div></div>
    <div class="light-hanger"><div class="wire" style="height: 38px;"></div><div class="holder"></div><div class="bulb"></div></div>
  </div>

  <!-- Ambient Glowing Fireflies & Sparkles -->
  <div class="sparkle-container" id="sparkleBox"></div>

  <div class="header-group">
    <div class="vow-subtitle">Sacred Promises</div>
    <h1 class="vow-main-title">Our 7 Vows of Love</h1>
  </div>

  <div class="vow-card-wrapper" id="vowsContainer"></div>

  <div class="nav-bar">
    <button class="btn-circle" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="counter-pill" id="counterTxt">Vow 1 / 7</div>
    <button class="btn-circle" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
  </div>

  <!-- Link to Book.html -->
  <div class="bottom-btn-row">
    <a href="book.html" id="nextPageBtn" class="btn-action btn-locked">
      <span>Our Memory Book</span>
      <i class="fa-solid fa-arrow-right"></i>
    </a>
  </div>

  <script src="anniversary-config.js"></script>
  <script>
    // 1. Soft Ambient Floating Sparkles
    const box = document.getElementById('sparkleBox');
    const symbols = ['✨', '🌸', '💖', '🌟'];

    for (let i = 0; i < 16; i++) {
      const dot = document.createElement('div');
      dot.className = 'firefly';
      const size = Math.random() * 5 + 4;
      dot.style.width = `${size}px`;
      dot.style.height = `${size}px`;
      dot.style.left = `${Math.random() * 92 + 4}%`;
      dot.style.top = `${Math.random() * 88 + 6}%`;
      dot.style.setProperty('--dur', `${3 + Math.random() * 3}s`);
      dot.style.setProperty('--twinkle-dur', `${2 + Math.random() * 2.5}s`);
      dot.style.animationDelay = `${Math.random() * 3}s`;
      box.appendChild(dot);
    }

    for (let i = 0; i < 10; i++) {
      const sym = document.createElement('div');
      sym.className = 'fairy-symbol';
      sym.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      sym.style.left = `${Math.random() * 90 + 5}%`;
      sym.style.top = `${Math.random() * 85 + 8}%`;
      sym.style.setProperty('--dur', `${3.5 + Math.random() * 3}s`);
      sym.style.setProperty('--twinkle-dur', `${2 + Math.random() * 2}s`);
      sym.style.animationDelay = `${Math.random() * 2.5}s`;
      box.appendChild(sym);
    }

    // 2. Romantic Screen Tap Heart Popping Effect
    window.addEventListener('pointerdown', (e) => {
      const heart = document.createElement('div');
      heart.className = 'tap-heart-particle';
      const heartIcons = ['💖', '💕', '✨', '💍', '🌸'];
      heart.textContent = heartIcons[Math.floor(Math.random() * heartIcons.length)];
      heart.style.left = e.clientX + 'px';
      heart.style.top = e.clientY + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1000);
    });

    // 3. Dynamic Vows Rendering
    const container = document.getElementById('vowsContainer');
    const vowsList = (typeof ANNIVERSARY_CONFIG !== "undefined" && ANNIVERSARY_CONFIG.vows) ? ANNIVERSARY_CONFIG.vows : [];

    vowsList.forEach((vow, idx) => {
      const card = document.createElement('div');
      card.className = `vow-card ${idx === 0 ? 'active' : ''}`;
      card.innerHTML = `
        <div class="vow-number-pill">${vow.num}</div>
        <div class="vow-photo-box"><img src="${vow.img}" onerror="this.src='profile.jpg'" alt="Vow ${idx+1}"></div>
        <div class="vow-text-card">
          <div class="vow-title">${vow.title}</div>
          <div class="vow-desc">${vow.desc}</div>
        </div>
      `;
      container.appendChild(card);
    });

    const cards = Array.from(document.querySelectorAll('.vow-card'));
    const total = cards.length;
    let current = 0;

    const counter = document.getElementById('counterTxt');
    const nextBtnAction = document.getElementById('nextPageBtn');

    function updateCardView() {
      cards.forEach((card, idx) => {
        card.classList.toggle('active', idx === current);
      });
      counter.textContent = `Vow ${current + 1} / ${total}`;

      if (current === total - 1) {
        nextBtnAction.classList.remove('btn-locked');
        confetti({
          particleCount: 100,
          spread: 85,
          origin: { y: 0.65 },
          colors: ['#ff1493', '#ff416c', '#ff758c', '#ffd700', '#ffffff']
        });
      }
    }

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (current < total - 1) { current++; updateCardView(); }
    });
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (current > 0) { current--; updateCardView(); }
    });

    // Touch Swipe Support
    let startX = 0;
    const stage = document.getElementById('vowsContainer');
    stage.addEventListener('touchstart', e => { startX = e.changedTouches[0].screenX; }, {passive: true});
    stage.addEventListener('touchend', e => {
      let endX = e.changedTouches[0].screenX;
      if (startX - endX > 50 && current < total - 1) {
        current++;
        updateCardView();
      } else if (endX - startX > 50 && current > 0) {
        current--;
        updateCardView();
      }
    }, {passive: true});

    updateCardView();
  </script>
</body>
</html>
